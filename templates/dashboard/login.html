{% load static %}<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión · Panel {{ STORE_NAME }}</title>
    <link rel="icon" type="image/png" href="{% static 'img/favicon.png' %}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: { extend: { fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'] } } },
        };
    </script>
</head>
<body class="min-h-screen flex items-center justify-center bg-slate-100 text-slate-900 font-sans antialiased px-4">

<div class="w-full max-w-sm bg-white border border-slate-200 rounded-xl p-6">
    <div class="flex justify-center mb-4">
        <img src="{% static 'img/logo.png' %}" alt="{{ STORE_NAME }}" class="h-20 w-auto rounded-lg">
    </div>
    <p class="text-xs uppercase tracking-wide text-slate-400 mb-1 text-center">🔒 Panel de administración</p>
    <h1 class="text-xl font-semibold text-slate-900 mb-6 text-center">{{ STORE_NAME }}</h1>

    {% if form.errors %}
        <div class="rounded-md border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700 mb-4">
            Usuario o contraseña incorrectos.
        </div>
    {% endif %}

    <form method="post" class="space-y-4">
        {% csrf_token %}
        <div>
            <label for="{{ form.username.id_for_label }}" class="block text-sm font-medium text-slate-700 mb-1">Usuario</label>
            <input type="text" name="{{ form.username.html_name }}" id="{{ form.username.id_for_label }}" autofocus
                   class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm text-slate-900 focus:outline-none focus:ring-2 focus:ring-slate-900 focus:border-slate-900">
        </div>
        <div>
            <label for="{{ form.password.id_for_label }}" class="block text-sm font-medium text-slate-700 mb-1">Contraseña</label>
            <div class="relative">
                <input type="password" name="{{ form.password.html_name }}" id="{{ form.password.id_for_label }}"
                       class="w-full rounded-md border border-slate-300 px-3 py-2 pr-10 text-sm text-slate-900 focus:outline-none focus:ring-2 focus:ring-slate-900 focus:border-slate-900">
                <button type="button" onclick="togglePassword(this)" aria-label="Mostrar contraseña"
                        class="absolute inset-y-0 right-0 flex items-center px-3 text-slate-400 hover:text-slate-600">
                    <svg data-eye-open class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" />
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                    </svg>
                    <svg data-eye-closed class="h-4 w-4 hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.451 10.451 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.522 10.522 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88" />
                    </svg>
                </button>
            </div>
        </div>
        <input type="hidden" name="next" value="{{ next }}">
        <button type="submit" class="w-full px-4 py-2.5 rounded-md bg-slate-900 text-white text-sm font-medium hover:bg-slate-800 hover:scale-[1.02] transition-all">Entrar →</button>
    </form>
</div>

<script>
    function togglePassword(btn) {
        const input = btn.closest('.relative').querySelector('input');
        const openIcon = btn.querySelector('[data-eye-open]');
        const closedIcon = btn.querySelector('[data-eye-closed]');
        const showing = input.type === 'password';
        input.type = showing ? 'text' : 'password';
        openIcon.classList.toggle('hidden', showing);
        closedIcon.classList.toggle('hidden', !showing);
        btn.setAttribute('aria-label', showing ? 'Ocultar contraseña' : 'Mostrar contraseña');
    }
</script>

</body>
</html>
