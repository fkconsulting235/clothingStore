{% extends "dashboard/base.html" %}

{% block content %}
    <h1 class="text-xl font-semibold text-slate-900 mb-6">{% if category %}Editar categoría{% else %}Nueva categoría{% endif %}</h1>

    <div class="max-w-md bg-white border border-slate-200 rounded-xl p-6">
        <form method="post" class="space-y-4">
            {% csrf_token %}
            {% for field in form %}
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">{{ field.label }}</label>
                    {{ field }}
                    {% if field.errors %}<p class="text-xs text-red-600 mt-1">{{ field.errors|join:", " }}</p>{% endif %}
                </div>
            {% endfor %}
            <div class="flex items-center gap-3">
                <button type="submit" class="px-5 py-2.5 rounded-md bg-slate-900 text-white text-sm font-medium hover:bg-slate-800 hover:scale-105 transition-all">💾 Guardar</button>
                <a href="{% url 'dashboard:category_list' %}" class="text-sm text-slate-500 hover:text-slate-700">Cancelar</a>
            </div>
        </form>
    </div>
{% endblock %}
