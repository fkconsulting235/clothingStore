{% extends "dashboard/base.html" %}

{% block content %}
    <div class="max-w-md bg-white border border-slate-200 rounded-xl p-6">
        <h1 class="text-lg font-semibold text-slate-900 mb-2">⚠️ ¿Eliminar esta cuenta bancaria?</h1>
        <p class="text-sm text-slate-600 mb-6">
            <strong>{{ bank_account.bank_name }} · {{ bank_account.account_number }}</strong> dejará de mostrarse a los clientes al pagar.
        </p>
        <form method="post" class="flex items-center gap-3">
            {% csrf_token %}
            <button type="submit" class="px-4 py-2.5 rounded-md bg-red-600 text-white text-sm font-medium hover:bg-red-700 hover:scale-105 transition-all">Sí, eliminar</button>
            <a href="{% url 'dashboard:bank_account_list' %}" class="text-sm text-slate-500 hover:text-slate-700">Cancelar</a>
        </form>
    </div>
{% endblock %}
